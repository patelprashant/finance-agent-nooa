[project]
name = "finance-agent"
version = "0.1.0"
description = "Learn NVIDIA-labs Object Oriented Agents (NOOA) by building a Smart Expense Categorizer that grows into a Personal Finance Assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nooa",
    "python-dotenv",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
