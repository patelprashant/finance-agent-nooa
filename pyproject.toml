[project]
name = "finance-agent"
version = "0.1.0"
description = "Learn NVIDIA-labs Object Oriented Agents (NOOA) by building a Smart Expense Categorizer that grows into a Personal Finance Assistant."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa",
    "python-dotenv",
    "mcp",
    "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0,<7",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-m 'not live_provider'"
markers = [
    "deterministic: tests that run locally without provider credentials or network access",
    "integration: tests that exercise interactions across application components",
    "ui: tests that exercise presentation adapters or user-interface behavior",
    "live_provider: manually invoked checks that may call a configured external provider",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
